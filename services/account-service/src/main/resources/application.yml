server:
  address: 127.0.0.1
  port: 9101
  shutdown: graceful

spring:
  application:
    name: tidebid-account
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

tidebid:
  development-admin:
    enabled: ${TIDEBID_DEV_ADMIN_ENABLED:false}
    username: ${TIDEBID_DEV_ADMIN_USERNAME:}
    password: ${TIDEBID_DEV_ADMIN_PASSWORD:}
    nickname: ${TIDEBID_DEV_ADMIN_NICKNAME:TideBid Administrator}

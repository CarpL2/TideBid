# Local database mode: MySQL runs in Docker while the Java service runs on the host.
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    url: "jdbc:mysql://${TIDEBID_MYSQL_HOST:127.0.0.1}:${TIDEBID_MYSQL_PORT:13306}/tidebid_auction?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    username: tidebid_auction_app
    password: ${TIDEBID_AUCTION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TideBidAuctionPool
      minimum-idle: 1
      maximum-pool-size: 8
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: tidebid_auction
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never

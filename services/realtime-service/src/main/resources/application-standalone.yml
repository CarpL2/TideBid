# Skeleton-only mode: no external registration or remote configuration.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cloud:
    openfeign:
      enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    service-registry:
      auto-registration:
        enabled: false

tidebid:
  realtime:
    auction-client:
      enabled: false
    redis:
      enabled: false
    rocketmq:
      enabled: false

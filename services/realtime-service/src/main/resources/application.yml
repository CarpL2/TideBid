server:
  address: 127.0.0.1
  port: 9104
  shutdown: graceful

spring:
  application:
    name: tidebid-realtime
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: realtime-proxy

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

tidebid:
  realtime:
    ticket:
      ttl: 30s
      rate-limit-window: 60s
      rate-limit-max-requests: 10
    connection:
      max-per-user: 5
      lease-ttl: 120s
    subscription:
      max-per-connection: 20
      sync-buffer-capacity: 128
    heartbeat:
      interval: 30s
      idle-timeout: 90s
    queue:
      send-capacity: 128
      max-client-message-size: 8KB
      control-window: 10s
      control-max-messages: 30
    auction-client:
      enabled: true
      base-url: ""
      internal-token: ${TIDEBID_INTERNAL_SERVICE_TOKEN:}
      connect-timeout: 2s
      read-timeout: 3s
    redis:
      enabled: true
    rocketmq:
      enabled: true
      endpoints: ${TIDEBID_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
      request-timeout: 3s
      consumer-group: tidebid-realtime-auction-v1
      auction-events-topic: tidebid-auction-events

server:
  address: 127.0.0.1
  port: 9103
  shutdown: graceful

spring:
  application:
    name: tidebid-trade
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: reliable-trade

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

tidebid:
  trade:
    account-client:
      internal-token: ${TIDEBID_INTERNAL_SERVICE_TOKEN:}
    order:
      payment-window: ${TIDEBID_TRADE_PAYMENT_WINDOW:30m}
    payment:
      recovery-enabled: true
      initial-recovery-delay: 5s
      initial-retry-delay: 5s
      maximum-retry-delay: 5m
      lease-duration: 30s
      scan-interval: 5s
      batch-size: 20
      maximum-attempts: 12
    payment-timeout:
      enabled: true
      scan-interval: 5s
      batch-size: 50

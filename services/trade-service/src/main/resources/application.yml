server:
  address: 127.0.0.1
  port: 9103
  shutdown: graceful

spring:
  application:
    name: tidebid-trade
  profiles:
    default: standalone
  threads:
    virtual:
      enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    stage: foundation

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

tidebid:
  trade:
    order:
      payment-window: 30m

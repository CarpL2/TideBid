brokerClusterName=TideBidLocalCluster
brokerName=tidebid-broker
brokerId=0
brokerIP1=rocketmq-broker
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=false
timerMaxDelaySec=259200
# The host may expose dozens of CPUs to Docker. RocketMQ sizes the pull pool from
# that count and each POP worker lazily owns a multi-megabyte direct buffer.
# Keep the local single-broker profile bounded instead of inheriting server-scale
# thread counts that exhaust direct memory during retry-heavy acceptance tests.
pullMessageThreadPoolNums=16
storePathRootDir=/home/rocketmq/store

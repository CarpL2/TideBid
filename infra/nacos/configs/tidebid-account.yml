spring:
  datasource:
    url: "jdbc:mysql://${TIDEBID_MYSQL_HOST:127.0.0.1}:${TIDEBID_MYSQL_PORT:13306}/tidebid_account?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    username: tidebid_account_app
    password: ${TIDEBID_ACCOUNT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TideBidAccountPool
      minimum-idle: 1
      maximum-pool-size: 8
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: tidebid_account
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never

logging:
  level:
    io.github.carpl2.tidebid.account: INFO

tidebid:
  messaging:
    rocketmq:
      topics:
        account-events: tidebid-account-events
        auction-events: tidebid-auction-events
        trade-events: tidebid-trade-events
      consumer-groups:
        deposit-settlement: tidebid-account-deposit-v1
        seller-credit: tidebid-account-credit-v1

info:
  config:
    service-source: nacos:tidebid-account.yml
    revision: reliable-trade-03-messaging

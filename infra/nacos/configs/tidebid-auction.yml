spring:
  datasource:
    url: "jdbc:mysql://${TIDEBID_MYSQL_HOST:127.0.0.1}:${TIDEBID_MYSQL_PORT:13306}/tidebid_auction?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    username: tidebid_auction_app
    password: ${TIDEBID_AUCTION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TideBidAuctionPool
      minimum-idle: 1
      maximum-pool-size: 8
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: tidebid_auction
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never

logging:
  level:
    io.github.carpl2.tidebid.auction: INFO

tidebid:
  auction:
    timing:
      anti-sniping-window: 60s
      anti-sniping-extension: 60s
      max-total-extension: 5m

  messaging:
    rocketmq:
      topics:
        auction-events: tidebid-auction-events
        scheduled-commands: tidebid-scheduled-commands
      consumer-groups:
        close-auction: tidebid-auction-close-v1

info:
  config:
    service-source: nacos:tidebid-auction.yml
    revision: reliable-trade-03-messaging
